# How a worktree of this project is built; see `ddev branchery docs`.
profile: typo3-app
docroot: .build/public
bin: .build/bin

# The uploads live below the docroot, and a worktree that takes the
# project's data needs them to render its images.
data:
  from: source
  needs:
    - config/sites
    - config/system/settings.php
    - .build/public/fileadmin
  addresses:
    - config/sites
