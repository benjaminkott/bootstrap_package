key: l_3col
parent: layouts
sorting: 70
backend_layout: pagets__3_columns
header:
  plain: true
en:
  title: '3 Columns'
  subtitle: Backend layout 3_columns
  abstract: Left, main and right column – a quarter, a half, a quarter.
  keywords: layouts, columns
de:
  title: '3 Spalten'
  subtitle: Backend-Layout 3_columns
  abstract: 'Linke, Haupt- und rechte Spalte – ein Viertel, die Hälfte, ein Viertel.'
thumbnail:
  - file: layouts/3_columns.png
    alt: Schematic of the 3 Columns layout
    alt.de: Schema des Layouts 3 Spalten

content:
  - key: l_3col_h
    type: text
    header_layout: 2
    en:
      header: The main column
      bodytext: |-
        <p class="lead">Left, main and right column – a quarter, a half, a quarter.</p><p>This text sits in the main column. Every other column of this layout holds a short note so you can see where it renders; the footer columns are inherited from the start page.</p>
    de:
      header: Die Hauptspalte
      bodytext: |-
        <p class="lead">Linke, Haupt- und rechte Spalte – ein Viertel, die Hälfte, ein Viertel.</p><p>Dieser Text sitzt in der Hauptspalte. Jede andere Spalte dieses Layouts enthält eine kurze Notiz, damit du siehst, wo sie gerendert wird; die Footer-Spalten werden von der Startseite vererbt.</p>
  - key: l_3col_before
    type: text
    column: before
    header_layout: 3
    frame_options: ruler-after,indent-left,indent-right
    space_before_class: large
    space_after_class: medium
    en:
      header: Content before the columns
      bodytext: |-
        <p>Full width, above the columns – the place for an introduction.</p>
    de:
      header: Inhalt vor den Spalten
      bodytext: |-
        <p>Volle Breite, über den Spalten – der Platz für eine Einleitung.</p>
  - key: l_3col_after
    type: text
    column: after
    header_layout: 3
    header_position: center
    frame_options: indent-left,indent-right
    space_before_class: extra-large
    space_after_class: extra-large
    background_color_class: quaternary
    en:
      header: Content after the columns
      bodytext: |-
        <p class="text-center">Full width, below the columns – the place for a call to action.</p><p class="text-center"><a class="btn btn-light" href="page:layouts">All layouts</a></p>
    de:
      header: Inhalt nach den Spalten
      bodytext: |-
        <p class="text-center">Volle Breite, unter den Spalten – der Platz für eine Handlungsaufforderung.</p><p class="text-center"><a class="btn btn-light" href="page:layouts">Alle Layouts</a></p>
  - key: l_3col_c1
    type: text
    column: left
    header_layout: 4
    frame_layout: embedded
    background_color_class: light
    en:
      header: Left column
      bodytext: |-
        <p>This column is called <em>left</em>.</p>
    de:
      header: Linke Spalte
      bodytext: |-
        <p>Diese Spalte heißt <em>left</em>.</p>
  - key: l_3col_c2
    type: text
    column: right
    header_layout: 4
    frame_layout: embedded
    background_color_class: light
    en:
      header: Right column
      bodytext: |-
        <p>This column is called <em>right</em>.</p>
    de:
      header: Rechte Spalte
      bodytext: |-
        <p>Diese Spalte heißt <em>right</em>.</p>
