    en:
      header: The main column
      bodytext: |-
        <p class="lead">A narrow left column, the main column takes three quarters.</p><p>This text sits in the main column. Every other column of this layout holds a short note so you can see where it renders; the footer columns are inherited from the start page.</p>
    de:
      header: Die Hauptspalte
      bodytext: |-
        <p class="lead">Eine schmale linke Spalte, die Hauptspalte nimmt drei Viertel.</p><p>Dieser Text sitzt in der Hauptspalte. Jede andere Spalte dieses Layouts enthält eine kurze Notiz, damit du siehst, wo sie gerendert wird; die Footer-Spalten werden von der Startseite vererbt.</p>
